name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity, and scheduled runs alone do not count. This
# checks weekly and, once the default branch has had no commits for 30 days,
# pushes a timestamp update to .github/.keepalive so "MeroShare Script" stays
# enabled. Pushes made with GITHUB_TOKEN do not trigger other workflows.

on:
  schedule:
    - cron: "23 7 * * 3"   # Runs 07:23 UTC every Wednesday
  workflow_dispatch:        # allow manual trigger
    inputs:
      force:
        description: Push a keepalive commit even if the branch had recent commits
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  keepalive:
    # Scheduled runs always use the default branch; manual runs must too.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Push keepalive commit if the branch has been quiet
        env:
          FORCE: ${{ inputs.force }}
          QUIET_DAYS: 30
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$FORCE" != "true" ] && [ "$days" -lt "$QUIET_DAYS" ]; then
            echo "Last commit was $days day(s) ago; no keepalive needed."
            exit 0
          fi
          {
            echo "# Updated by .github/workflows/keepalive.yml; do not edit."
            date -u +%Y-%m-%dT%H:%M:%SZ
          } > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "chore: keepalive to keep scheduled workflows enabled"
          git push origin "HEAD:$GITHUB_REF_NAME"
